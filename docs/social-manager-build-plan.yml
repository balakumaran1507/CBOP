name: social-media-manager-linkedin
description: >
  Publishing (not monitoring) build plan for LinkedIn, split by API access
  path. Companion to docs/SOCIAL_Build_Plan.md - full R&D reasoning lives
  there, this file is the machine-readable task breakdown.
status: planned

paths:
  path_a:
    name: personal-profile-posting
    linkedin_scope: w_member_social
    linkedin_product: Share on LinkedIn
    access: self-serve, no partner review
    cost: free
    rate_limit: 150 posts/day/member
    posts_as: authenticated individual (e.g. Bala's own profile)
    caveat: access token expires ~60 days, no refresh token on self-serve tier - manual reconnect required
  path_b:
    name: company-page-posting
    linkedin_scope: w_organization_social
    linkedin_product: Community Management API
    access: gated - Development Tier then Standard Tier, screen-recording demo required for Standard
    prerequisite: provisioned through an Advertising API app tied to the same company page - likely needs a LinkedIn Ads account per company, even at $0 spend
    cost: no public per-call price, cost is approval time/friction not metered billing
    timeline: weeks to months
    posts_as: the real company brand (Etherence IT, AttackOS, etc.)

phases:
  - id: 1
    name: Path A end-to-end
    goal: working personal-profile publish loop, buildable now with zero external wait
    blocked_by: null
    migrations:
      - file: migrations/048_social_posts.sql
        changes:
          - alter_table: social_connections
            add_column: "connection_type TEXT CHECK (connection_type IN ('member','organization'))"
          - create_table: social_posts
            columns:
              - id
              - company_id
              - connection_id
              - content
              - media_url
              - "status ('draft'|'scheduled'|'published'|'failed')"
              - scheduled_at
              - published_at
              - external_post_urn
              - ai_generated BOOL
              - "source_type ('blog_post'|'job_listing'|'manual')"
              - source_id
              - created_by
              - error_message
              - created_at
    backend:
      new_files:
        - path: api/lib/linkedin.ts
          purpose: OAuth helpers (authorize URL, code exchange, OpenID userinfo -> person URN) + createLinkedInPost()
      edited_files:
        - path: api/routes/social.ts
          add_routes:
            - GET /api/social/linkedin/auth
            - GET /api/social/linkedin/callback
            - POST /api/social/posts
            - POST /api/social/posts/generate   # AI draft only, never auto-saves/publishes
            - PATCH /api/social/posts/:id
            - DELETE /api/social/posts/:id
            - POST /api/social/posts/:id/publish
            - GET /api/social/posts?companyId=
          other_changes:
            - "PLATFORM_INFO.linkedin.recommended -> true for this path"
    frontend:
      edited_files:
        - path: "app/(dashboard)/social/page.tsx"
          changes:
            - compose slide-over (AI-assist button, connection picker, preview, Save Draft / Publish Now)
            - post list with status chips
            - "Connect LinkedIn (personal)" button on existing platform card
    config:
      env_vars_added:
        - LINKEDIN_CLIENT_ID
        - LINKEDIN_CLIENT_SECRET
        - LINKEDIN_REDIRECT_URI

  - id: 2
    name: Path B wiring
    goal: company-page publish path, code-complete but functionally gated on real LinkedIn approval
    blocked_by: LinkedIn Community Management API Standard Tier approval (external, user-driven)
    reuses: [social_posts table, createLinkedInPost() from Phase 1]
    backend:
      changes:
        - connection_type='organization', scope w_organization_social, author = org URN
        - org URN captured via manual paste field in connect flow (programmatic lookup needs another scope, not worth it)
    degrade_behavior: "not connected / pending LinkedIn approval" banner, no crash, no fake data - same pattern as /seo's Google-OAuth-gated features
    user_side_actions:
      - file Community Management API Development Tier application
      - record screen-recording demo for Standard Tier upgrade
      - likely stand up a LinkedIn Ads account for at least one company page to provision through
    note: this phase's external approval step is not something Claude can do - flagged, not scheduled

  - id: 3
    name: deferred
    goal: not part of this build, listed for future reference
    items:
      - name: scheduled auto-publish
        reason: CLAUDE.md forbids custom scheduler code in CBOP - needs a real n8n workflow (poll scheduled_at <= NOW(), call existing publish endpoint), same as blog's deferred auto-publish
        interim_behavior: scheduled posts sit for manual publish, worded as a reminder not a malfunction (same Pulse posture as blog)
      - name: token-expiry Pulse reminder
        reason: Path A has no refresh token on the self-serve tier, ~60 day manual reconnect
      - name: auto-pull Blog/Hiring content into drafts
        reason: nice-to-have, not required for a working publish loop - user can manually pick a source post/listing at launch

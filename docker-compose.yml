version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cbop-postgres
    environment:
      POSTGRES_DB: cbop_v2
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - cbop-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d cbop_v2"]
      interval: 10s
      timeout: 5s
      retries: 5

  # n8n Automation Platform
  n8n:
    image: n8nio/n8n:1.123.67
    container_name: cbop-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=${TIMEZONE}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      # Production settings
      - N8N_LOG_LEVEL=warn
      - N8N_METRICS=false
      - N8N_PUBLIC_API_DISABLED=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # CBOP integration — host is reachable at 172.21.0.1 from inside cbop-network
      - CBOP_URL=http://172.21.0.1:3003
      - HERMES_URL=http://172.21.0.1:18790
      - HERMES_API_KEY=${HERMES_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - cbop-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # NOTE, verified 2026-08-06 directly against the real box: production does
  # NOT run cbop-app or accounting-app via docker-compose. Both run as bare
  # `npm start` processes under systemd (cbop.service, cbop-accounting.service
  # - see deploy/*.service in this repo), loading env from a plain .env file
  # via EnvironmentFile=. This docker-compose definition is aspirational /
  # kept for a possible future containerized deployment, not what's live.
  # Don't trust it as ground truth for how these apps are actually running.

  # CBOP Application (Next.js + Hono.js)
  cbop-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbop-app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cbop_v2
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - HERMES_URL=${HERMES_URL}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - OUTLINE_URL=${OUTLINE_URL}
      - OUTLINE_API_TOKEN=${OUTLINE_API_TOKEN}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - N8N_URL=http://n8n:5678
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      # .etherence.com (leading dot) so the session cookie set here is also
      # readable by accounting-app below - see api/lib/auth.ts. .etherence.com,
      # not .cbop.etherence.com: accounting.etherence.com is a sibling
      # subdomain, not nested under cbop.etherence.com (renamed 2026-08-07,
      # Cloudflare free Universal SSL doesn't cover a two-label subdomain).
      - BETTER_AUTH_COOKIE_DOMAIN=.etherence.com
      - BETTER_AUTH_TRUSTED_ORIGINS=https://accounting.etherence.com
    ports:
      - "127.0.0.1:3003:3000"
    networks:
      - cbop-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # CBOP Accounting - separate Next.js app, SSO'd to cbop-app above via the
  # shared cross-subdomain session cookie. docs/modules/ACCOUNTING_Build_Plan.md.
  accounting-app:
    build:
      context: ./accounting-app
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CBOP_API_URL=https://cbop.etherence.com
        - NEXT_PUBLIC_CBOP_LOGIN_URL=https://cbop.etherence.com/login
        - NEXT_PUBLIC_ACCOUNTING_URL=https://accounting.etherence.com
    container_name: cbop-accounting-app
    environment:
      - NODE_ENV=production
      # Container-to-container - server-side session verification never
      # depends on the public hostname/DNS/NPM being up for what is an
      # internal request between two services on the same Docker network.
      - CBOP_API_URL=http://cbop-app:3000
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - cbop-network
    depends_on:
      - cbop-app
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:

networks:
  cbop-network:
    driver: bridge
